[project]
name = "careconnect-backend"
version = "0.1.0"
description = "CareConnect clinic scheduling and triage API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.0",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: needs a real Postgres"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "mypy>=2.3.1",
    "openapi-core>=0.23.1",
    "pytest>=9.1.1",
    "pytest-socket>=0.8.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.9",
    "schemathesis>=4.28.0",
    "types-pyyaml>=6.0.12.20260906",
]
