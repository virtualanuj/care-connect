openapi: 3.0.3
info:
  title: CareConnect API
  description: >
    Clinic appointment and patient-triage API. Implements the contract
    described in docs/spec.md. This file is the single source of truth: on
    any conflict with another doc, this file wins. All endpoints require
    staff authentication (front-desk or doctor) except login — there is no
    patient-facing surface in v1.


    Conventions: all timestamps are UTC ISO-8601 date-times; `date`
    parameters and `ClockTime` values are interpreted in
    `ClinicSettings.clinicTimezone`. Status mapping — 400 malformed or
    schema-invalid request, 401 unauthenticated, 403 permission denied,
    404 not found, 409 state conflict, 422 policy/business-rule violation,
    429 rate limited, 503 AI provider unavailable. Every error body is
    `Error` with a `code` from `ErrorCode`.
  version: 0.2.0
servers:
  - url: /api/v1

security:
  - bearerAuth: []

tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Doctors
  - name: Availability
  - name: Specialties
  - name: Patients
  - name: Slots
  - name: Appointments
  - name: Triage
  - name: Summary
  - name: VisitNotes
  - name: Queue
  - name: ClinicSettings
  - name: Audit

paths:
  # -------------------------------------------------------------- Health
  /health:
    get:
      tags: [Health]
      summary: Liveness check
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, example: ok }

  # ---------------------------------------------------------------- Auth
  /auth/login:
    post:
      tags: [Auth]
      summary: Staff login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, tokenType, expiresIn, role]
                properties:
                  accessToken: { type: string }
                  tokenType: { type: string, example: bearer }
                  expiresIn:
                    type: integer
                    description: Token lifetime in seconds (short-lived).
                  role: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/me:
    get:
      tags: [Auth]
      summary: Current authenticated user
      responses:
        "200":
          description: The authenticated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # --------------------------------------------------------------- Users
  /users:
    get:
      tags: [Users]
      summary: List users
      description: Front-desk only.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Users]
      summary: Create a user
      description: Front-desk only. Written to the audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    patch:
      tags: [Users]
      summary: Update a user (role, name, active)
      description: >
        Front-desk only. Deactivation takes effect immediately (active is
        checked on every request). Written to the audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{userId}/reset-password:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [Users]
      summary: Reset a user's password
      description: Front-desk only. Written to the audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                newPassword: { type: string, format: password, minLength: 12 }
      responses:
        "204":
          description: Password reset
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ------------------------------------------------------------- Doctors
  /doctors:
    get:
      tags: [Doctors]
      summary: List doctors
      parameters:
        - name: specialtyId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: List of doctors
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Doctor" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Doctors]
      summary: Create a doctor profile
      description: Front-desk only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DoctorCreate" }
      responses:
        "201":
          description: Doctor created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Doctor" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /doctors/{doctorId}:
    parameters:
      - $ref: "#/components/parameters/DoctorId"
    get:
      tags: [Doctors]
      summary: Get a doctor
      responses:
        "200":
          description: The doctor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Doctor" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Doctors]
      summary: Update a doctor
      description: >
        Front-desk may update any doctor. A doctor may only update their
        own profile (spec.md §1). Setting `active=false` is rejected with
        `AVAILABILITY_CONFLICTS_WITH_APPOINTMENTS` while non-cancelled
        future appointments exist. A `slotLengthMinutes` change affects
        future slot generation only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DoctorUpdate" }
      responses:
        "200":
          description: Updated doctor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Doctor" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # --------------------------------------------------------- Availability
  /doctors/{doctorId}/availability:
    parameters:
      - $ref: "#/components/parameters/DoctorId"
    get:
      tags: [Availability]
      summary: List weekly availability rules for a doctor
      responses:
        "200":
          description: Availability rules
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Availability" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Availability]
      summary: Add a weekly availability rule
      description: >
        Front-desk, or the doctor for their own availability. A rule may
        not overlap another rule for the same doctor and day.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AvailabilityCreate" }
      responses:
        "201":
          description: Rule created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Availability" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /doctors/{doctorId}/availability/{availabilityId}:
    parameters:
      - $ref: "#/components/parameters/DoctorId"
      - $ref: "#/components/parameters/AvailabilityId"
    patch:
      tags: [Availability]
      summary: Update a weekly availability rule
      description: >
        Narrowing or moving a rule is rejected with
        `AVAILABILITY_CONFLICTS_WITH_APPOINTMENTS` if it would orphan
        non-cancelled future appointments.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AvailabilityUpdate" }
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Availability" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Availability]
      summary: Remove a weekly availability rule
      description: >
        Rejected with `AVAILABILITY_CONFLICTS_WITH_APPOINTMENTS` if it
        would orphan non-cancelled future appointments.
      responses:
        "204":
          description: Deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /doctors/{doctorId}/availability-exceptions:
    parameters:
      - $ref: "#/components/parameters/DoctorId"
    get:
      tags: [Availability]
      summary: List one-off availability exceptions
      responses:
        "200":
          description: Exceptions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AvailabilityException" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Availability]
      summary: Add a one-off exception (holiday, extra hours)
      description: >
        An `unavailable` exception with no times blocks the whole day and
        is rejected with `AVAILABILITY_CONFLICTS_WITH_APPOINTMENTS` if
        non-cancelled appointments exist that day. `extra_hours` requires
        both times.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AvailabilityExceptionCreate" }
      responses:
        "201":
          description: Exception created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvailabilityException" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /doctors/{doctorId}/availability-exceptions/{exceptionId}:
    parameters:
      - $ref: "#/components/parameters/DoctorId"
      - $ref: "#/components/parameters/ExceptionId"
    patch:
      tags: [Availability]
      summary: Update a one-off exception
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AvailabilityExceptionUpdate" }
      responses:
        "200":
          description: Updated exception
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvailabilityException" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Availability]
      summary: Remove a one-off exception
      responses:
        "204":
          description: Deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # -------------------------------------------------------- Specialties
  /specialties:
    get:
      tags: [Specialties]
      summary: List specialties
      responses:
        "200":
          description: Specialties
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Specialty" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Specialties]
      summary: Create a specialty
      description: Front-desk only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpecialtyCreate" }
      responses:
        "201":
          description: Specialty created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Specialty" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /specialties/{specialtyId}:
    parameters:
      - name: specialtyId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Specialties]
      summary: Update a specialty
      description: Front-desk only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpecialtyUpdate" }
      responses:
        "200":
          description: Updated specialty
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Specialty" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ------------------------------------------------------------ Patients
  /patients:
    get:
      tags: [Patients]
      summary: Look up or list patients
      description: >
        With `phone`, returns every patient registered under that number
        (spec.md §2 — a phone may map to multiple patients, e.g. family
        members). Without it, returns a general paginated list. Doctors
        may read all patients (spec.md §1).
      parameters:
        - name: phone
          in: query
          description: Any common phone format; normalized to E.164 before matching.
          schema: { type: string }
        - name: name
          in: query
          description: Case-insensitive name prefix filter.
          schema: { type: string }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Matching patients
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatientPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Patients]
      summary: Register a patient
      description: >
        Rejected with `PATIENT_ALREADY_EXISTS` if the (E.164 phone,
        normalized name) pair already exists.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatientCreate" }
      responses:
        "201":
          description: Patient registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Patient" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /patients/{patientId}:
    parameters:
      - $ref: "#/components/parameters/PatientId"
    get:
      tags: [Patients]
      summary: Get a patient
      responses:
        "200":
          description: The patient
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Patient" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Patients]
      summary: Update patient demographics
      description: >
        Front-desk or a doctor (spec.md §1). A change that collides with
        an existing (phone, name) is rejected with
        `PATIENT_ALREADY_EXISTS`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatientUpdate" }
      responses:
        "200":
          description: Updated patient
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Patient" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /patients/{patientId}/medical-history:
    parameters:
      - $ref: "#/components/parameters/PatientId"
    get:
      tags: [Patients]
      summary: List a patient's medical history entries
      responses:
        "200":
          description: Medical history (free-text, append-only, per spec.md §2)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MedicalHistoryEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Patients]
      summary: Add a medical history entry or an amendment
      description: >
        Append-only. To correct an entry, post `kind=amendment` with
        `amendsEntryId`; the original is never edited or deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MedicalHistoryEntryCreate" }
      responses:
        "201":
          description: Entry added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MedicalHistoryEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Slots
  /slots:
    get:
      tags: [Slots]
      summary: Search bookable slots
      description: >
        Provide exactly one of `doctorId` or `specialtyId` (otherwise 400).
        A specialty search returns every matching doctor's open slots as a
        choice for front-desk (spec.md §4) rather than auto-selecting one.
        The last N slots of each doctor's day are held back for
        emergencies (spec.md §4) and excluded unless
        `includeEmergency=true`; unbooked held slots are released to
        regular results 60 minutes before start. Slots in the past are
        never returned. Searching does not authorize emergency booking —
        authorization is verified at booking time.
      parameters:
        - name: doctorId
          in: query
          schema: { type: string, format: uuid }
        - name: specialtyId
          in: query
          schema: { type: string, format: uuid }
        - name: date
          in: query
          required: true
          description: Calendar date in the clinic time zone.
          schema: { type: string, format: date }
        - name: includeEmergency
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Matching slots
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Slot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ----------------------------------------------------------- Appointments
  /appointments:
    get:
      tags: [Appointments]
      summary: List/query appointments
      description: A doctor sees only their own appointments.
      parameters:
        - name: doctorId
          in: query
          schema: { type: string, format: uuid }
        - name: patientId
          in: query
          schema: { type: string, format: uuid }
        - name: date
          in: query
          schema: { type: string, format: date }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/AppointmentStatus" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Matching appointments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppointmentPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Appointments]
      summary: Book an appointment
      description: >
        `startTime` must be a real generated slot for the doctor
        (`INVALID_SLOT` otherwise); `endTime` is derived by the server.
        Rejected on any overlap for the same doctor
        (`SLOT_ALREADY_BOOKED`) or the same patient
        (`PATIENT_ALREADY_BOOKED`) — DB-enforced (spec.md §4). A held-back
        emergency slot requires `emergencyJustification`: `triage` (the
        server verifies `triageResultId` belongs to the patient and its
        effective urgency is `emergency`, else `EMERGENCY_NOT_AUTHORIZED`)
        or `front_desk_judgment` (requires `emergencyReason`; front-desk
        only). The server sets `isEmergencySlot` from the slot and stores
        the justification and authorizing user. A doctor may only book
        with themselves.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppointmentCreate" }
      responses:
        "201":
          description: Appointment booked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /appointments/{appointmentId}:
    parameters:
      - $ref: "#/components/parameters/AppointmentId"
    get:
      tags: [Appointments]
      summary: Get an appointment
      responses:
        "200":
          description: The appointment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /appointments/{appointmentId}/reschedule:
    parameters:
      - $ref: "#/components/parameters/AppointmentId"
    post:
      tags: [Appointments]
      summary: Reschedule an appointment
      description: >
        Only from `booked`. Creates a new appointment and cancels the old
        one (`cancellationType=rescheduled`, `rescheduledToId` set) in one
        transaction; returns the **new** appointment. Triage reference and
        reported symptoms carry over. Cannot target a held-back emergency
        slot. Rejected with 422 `CANCELLATION_WINDOW_CLOSED` when the
        original starts within `ClinicSettings.cancellationCutoffHours`
        (inclusive); rejected with 409 `SLOT_ALREADY_BOOKED` /
        `PATIENT_ALREADY_BOOKED` if the new slot is unavailable, and 422
        `INVALID_SLOT` if it is not a real slot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newStartTime]
              properties:
                newStartTime: { type: string, format: date-time }
      responses:
        "200":
          description: The new (rescheduled) appointment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /appointments/{appointmentId}/cancel:
    parameters:
      - $ref: "#/components/parameters/AppointmentId"
    post:
      tags: [Appointments]
      summary: Cancel an appointment (standard)
      description: >
        From `booked` or `checked_in`. Rejected with 422
        `CANCELLATION_WINDOW_CLOSED` when `start - now` is at most
        `ClinicSettings.cancellationCutoffHours` (spec.md §4). Use
        force-cancel to bypass.
      responses:
        "200":
          description: Cancelled appointment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidTransition" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /appointments/{appointmentId}/force-cancel:
    parameters:
      - $ref: "#/components/parameters/AppointmentId"
    post:
      tags: [Appointments]
      summary: Force-cancel an appointment past the cutoff
      description: >
        Front-desk only (spec.md §1, §4). Stored as
        `cancellationType=force` and written to the audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        "200":
          description: Force-cancelled appointment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidTransition" }

  /appointments/{appointmentId}/check-in:
    parameters:
      - $ref: "#/components/parameters/AppointmentId"
    post:
      tags: [Appointments]
      summary: Transition Booked → Checked-in
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidTransition" }

  /appointments/{appointmentId}/start-consultation:
    parameters:
      - $ref: "#/components/parameters/AppointmentId"
    post:
      tags: [Appointments]
      summary: Transition Checked-in → In-consultation
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidTransition" }

  /appointments/{appointmentId}/complete:
    parameters:
      - $ref: "#/components/parameters/AppointmentId"
    post:
      tags: [Appointments]
      summary: Transition In-consultation → Completed
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidTransition" }

  /appointments/{appointmentId}/no-show:
    parameters:
      - $ref: "#/components/parameters/AppointmentId"
    post:
      tags: [Appointments]
      summary: Mark Booked or Checked-in → No-show
      description: Always a manual action by front-desk or the appointment's doctor (spec.md §3).
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidTransition" }

  /appointments/{appointmentId}/follow-up:
    parameters:
      - $ref: "#/components/parameters/AppointmentId"
    post:
      tags: [Appointments]
      summary: Book a follow-up linked to this appointment
      description: >
        The original must be `completed` (`APPOINTMENT_NOT_COMPLETED`
        otherwise). The follow-up is for the same doctor and patient, in
        the future, in a regular (non-held-back) slot (`INVALID_SLOT`
        otherwise), and must start within
        `ClinicSettings.followUpMaxDays` of the original's start
        (`FOLLOW_UP_WINDOW_EXCEEDED`); a follow-up of a follow-up is
        measured from the root visit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startTime]
              properties:
                startTime: { type: string, format: date-time }
      responses:
        "201":
          description: Follow-up appointment booked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # --------------------------------------------------------------- Triage
  /patients/{patientId}/triage:
    parameters:
      - $ref: "#/components/parameters/PatientId"
    get:
      tags: [Triage]
      summary: List a patient's triage results, newest first
      responses:
        "200":
          description: Triage history (latest is current)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AITriageResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Triage]
      summary: Submit reported symptoms and run AI triage for a patient
      description: >
        Works before booking and for walk-ins; the appointment later
        references the result via `triageResultId`. Each call appends a
        new record. A deterministic red-flag check runs first and can
        force `emergency` (`source=red_flag`); a red-flag hit is still
        returned (201) if the model call fails. With no red-flag hit and
        the AI unavailable, returns 503 `AI_SERVICE_UNAVAILABLE`
        (booking may proceed without triage). Personal data is scrubbed
        from the text before it reaches the AI provider (spec.md §5.1).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reportedSymptoms]
              properties:
                reportedSymptoms: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "201":
          description: Triage result generated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AITriageResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /appointments/{appointmentId}/triage:
    parameters:
      - $ref: "#/components/parameters/AppointmentId"
    get:
      tags: [Triage]
      summary: Get the triage result this appointment was booked against
      responses:
        "200":
          description: Triage result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AITriageResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /triage-results/{triageResultId}/override:
    parameters:
      - name: triageResultId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Triage]
      summary: Override an AI triage result
      description: >
        Stored alongside the original AI output, which is never
        overwritten (spec.md §2, §5). The override wins for effective
        urgency. Requires a reason and is written to the audit log.
        Front-desk, or a doctor for triage tied to their own
        appointments.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [overriddenUrgency, overrideReason]
              properties:
                overriddenUrgency: { $ref: "#/components/schemas/Urgency" }
                overriddenSpecialtyId: { type: string, format: uuid }
                overrideReason: { type: string, minLength: 1 }
      responses:
        "200":
          description: Updated triage result with override applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AITriageResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # -------------------------------------------------------------- Summary
  /appointments/{appointmentId}/summary:
    parameters:
      - $ref: "#/components/parameters/AppointmentId"
    get:
      tags: [Summary]
      summary: Get the stored pre-visit summary
      description: >
        Returns the stored summary with a `stale` flag (true when history,
        symptoms, or triage changed since it was generated). 404 if none
        has been generated. Never calls the AI provider.
      responses:
        "200":
          description: Pre-visit summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreVisitSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Summary]
      summary: Generate or refresh the pre-visit summary
      description: >
        Assembled from patient history, reported symptoms, and triage
        result (spec.md §5.2). Personal data is scrubbed before the AI
        call.
      responses:
        "200":
          description: Generated pre-visit summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreVisitSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  # ------------------------------------------------------------ VisitNotes
  /appointments/{appointmentId}/visit-note:
    parameters:
      - $ref: "#/components/parameters/AppointmentId"
    get:
      tags: [VisitNotes]
      summary: Get the visit note for an appointment
      responses:
        "200":
          description: Visit note
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitNote" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [VisitNotes]
      summary: Create or update the raw visit notes
      description: >
        Front-desk or the appointment's doctor. Only while the appointment
        is `in_consultation` or `completed`
        (`VISIT_NOTE_NOT_WRITABLE` otherwise); locked after finalize
        (`VISIT_NOTE_LOCKED`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doctorNotes]
              properties:
                doctorNotes: { type: string, minLength: 1 }
      responses:
        "200":
          description: Updated visit note
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitNote" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /appointments/{appointmentId}/visit-note/draft:
    parameters:
      - $ref: "#/components/parameters/AppointmentId"
    post:
      tags: [VisitNotes]
      summary: Generate an AI draft summary from the raw notes
      description: >
        Writes `aiDraftSummary` only — never `finalSummary`, which
        requires explicit doctor action (spec.md §5.3, §6). Requires
        existing notes (`NO_NOTES_TO_DRAFT`). Rejected on a finalized
        note. Personal data is scrubbed before the AI call.
      responses:
        "200":
          description: Visit note with AI draft populated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitNote" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /appointments/{appointmentId}/visit-note/finalize:
    parameters:
      - $ref: "#/components/parameters/AppointmentId"
    post:
      tags: [VisitNotes]
      summary: Finalize the visit summary
      description: >
        Only the appointment's doctor may finalize (front-desk gets 403).
        Locks the note; a second finalize returns 409
        `VISIT_NOTE_LOCKED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [finalSummary]
              properties:
                finalSummary: { type: string, minLength: 1 }
      responses:
        "200":
          description: Finalized visit note
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitNote" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ------------------------------------------------------------------ Queue
  /queue:
    get:
      tags: [Queue]
      summary: Daily dashboard
      description: >
        The day's appointments (default today in the clinic time zone)
        bucketed by status; buckets are mutually exclusive. Walk-ins
        appear in the bucket for their status and are flagged with
        `source=walk_in`. A doctor sees only their own appointments.
      parameters:
        - name: date
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: The day's queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyQueue" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ------------------------------------------------------------ Clinic Settings
  /clinic-settings:
    get:
      tags: [ClinicSettings]
      summary: Get current clinic policy settings
      responses:
        "200":
          description: Clinic settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClinicSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [ClinicSettings]
      summary: Update clinic policy settings
      description: Front-desk only (spec.md §1, §4). Written to the audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClinicSettingsUpdate" }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClinicSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------- Audit
  /audit-log:
    get:
      tags: [Audit]
      summary: List audit log entries
      description: Front-desk only. Append-only record of sensitive actions.
      parameters:
        - name: action
          in: query
          schema: { $ref: "#/components/schemas/AuditAction" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Audit entries, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditLogPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DoctorId:
      name: doctorId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AvailabilityId:
      name: availabilityId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExceptionId:
      name: exceptionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PatientId:
      name: patientId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AppointmentId:
      name: appointmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    BadRequest:
      description: Malformed or schema-invalid request (code VALIDATION_ERROR)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, invalid, or expired credentials, or deactivated user
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but not permitted (see spec.md §1)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: >
        State conflict — see the operation description for the specific
        `ErrorCode` (e.g. SLOT_ALREADY_BOOKED, PATIENT_ALREADY_BOOKED,
        PATIENT_ALREADY_EXISTS, AVAILABILITY_CONFLICTS_WITH_APPOINTMENTS,
        AVAILABILITY_OVERLAP, USER_ALREADY_EXISTS, APPOINTMENT_NOT_COMPLETED,
        VISIT_NOTE_NOT_WRITABLE, VISIT_NOTE_LOCKED)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnprocessableEntity:
      description: >
        Policy or business-rule violation (e.g. CANCELLATION_WINDOW_CLOSED,
        FOLLOW_UP_WINDOW_EXCEEDED, INVALID_SLOT,
        EMERGENCY_JUSTIFICATION_REQUIRED, EMERGENCY_NOT_AUTHORIZED,
        NO_NOTES_TO_DRAFT)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidTransition:
      description: Lifecycle transition not valid from the current status (code INVALID_TRANSITION, spec.md §3)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limited (code RATE_LIMITED)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: AI provider unavailable or returned an invalid response (code AI_SERVICE_UNAVAILABLE)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    ErrorCode:
      type: string
      description: >
        The catalog of error codes. Each code has exactly one meaning and is
        used consistently everywhere it is raised.
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - INVALID_CREDENTIALS
        - FORBIDDEN
        - NOT_FOUND
        - RATE_LIMITED
        - SLOT_ALREADY_BOOKED
        - PATIENT_ALREADY_BOOKED
        - INVALID_SLOT
        - EMERGENCY_JUSTIFICATION_REQUIRED
        - EMERGENCY_NOT_AUTHORIZED
        - CANCELLATION_WINDOW_CLOSED
        - INVALID_TRANSITION
        - FOLLOW_UP_WINDOW_EXCEEDED
        - APPOINTMENT_NOT_COMPLETED
        - PATIENT_ALREADY_EXISTS
        - USER_ALREADY_EXISTS
        - AVAILABILITY_OVERLAP
        - AVAILABILITY_CONFLICTS_WITH_APPOINTMENTS
        - VISIT_NOTE_NOT_WRITABLE
        - VISIT_NOTE_LOCKED
        - NO_NOTES_TO_DRAFT
        - AI_SERVICE_UNAVAILABLE

    Error:
      type: object
      required: [code, message]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message: { type: string }

    ClockTime:
      type: string
      pattern: '^([01]\d|2[0-3]):[0-5]\d$'
      example: "09:30"
      description: Wall-clock time in the clinic time zone (HH:MM).

    Role:
      type: string
      enum: [doctor, front_desk_admin]

    User:
      type: object
      required: [id, email, name, role, active]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        active: { type: boolean }

    UserCreate:
      type: object
      required: [email, name, role, password]
      properties:
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        password: { type: string, format: password, minLength: 12 }

    UserUpdate:
      type: object
      properties:
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        active: { type: boolean }

    UserPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/User" }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }

    Specialty:
      type: object
      required: [id, name, defaultSlotLengthMinutes]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        defaultSlotLengthMinutes: { type: integer, minimum: 5 }

    SpecialtyCreate:
      type: object
      required: [name, defaultSlotLengthMinutes]
      properties:
        name: { type: string }
        defaultSlotLengthMinutes: { type: integer, minimum: 5 }

    SpecialtyUpdate:
      type: object
      properties:
        name: { type: string }
        defaultSlotLengthMinutes: { type: integer, minimum: 5 }

    Doctor:
      type: object
      required: [id, userId, name, specialtyId, slotLengthMinutes, active]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        name: { type: string }
        specialtyId: { type: string, format: uuid }
        slotLengthMinutes:
          type: integer
          minimum: 5
          description: >
            Doctor-specific slot length; seeded from the specialty default
            but independently editable (spec.md §4). Changes affect future
            slot generation only.
        active: { type: boolean }

    DoctorCreate:
      type: object
      required: [userId, name, specialtyId]
      properties:
        userId: { type: string, format: uuid }
        name: { type: string }
        specialtyId: { type: string, format: uuid }
        slotLengthMinutes:
          type: integer
          minimum: 5
          description: Defaults to the specialty's defaultSlotLengthMinutes if omitted.

    DoctorUpdate:
      type: object
      properties:
        name: { type: string }
        specialtyId: { type: string, format: uuid }
        slotLengthMinutes: { type: integer, minimum: 5 }
        active: { type: boolean }

    DayOfWeek:
      type: string
      enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]

    Availability:
      type: object
      required: [id, doctorId, dayOfWeek, startTime, endTime]
      properties:
        id: { type: string, format: uuid }
        doctorId: { type: string, format: uuid }
        dayOfWeek: { $ref: "#/components/schemas/DayOfWeek" }
        startTime: { $ref: "#/components/schemas/ClockTime" }
        endTime:
          allOf: [{ $ref: "#/components/schemas/ClockTime" }]
          description: Must be later than startTime (no overnight rules).

    AvailabilityCreate:
      type: object
      required: [dayOfWeek, startTime, endTime]
      properties:
        dayOfWeek: { $ref: "#/components/schemas/DayOfWeek" }
        startTime: { $ref: "#/components/schemas/ClockTime" }
        endTime: { $ref: "#/components/schemas/ClockTime" }

    AvailabilityUpdate:
      type: object
      properties:
        dayOfWeek: { $ref: "#/components/schemas/DayOfWeek" }
        startTime: { $ref: "#/components/schemas/ClockTime" }
        endTime: { $ref: "#/components/schemas/ClockTime" }

    AvailabilityExceptionType:
      type: string
      enum: [unavailable, extra_hours]

    AvailabilityException:
      type: object
      required: [id, doctorId, date, type]
      properties:
        id: { type: string, format: uuid }
        doctorId: { type: string, format: uuid }
        date: { type: string, format: date }
        type: { $ref: "#/components/schemas/AvailabilityExceptionType" }
        startTime:
          allOf: [{ $ref: "#/components/schemas/ClockTime" }]
          nullable: true
        endTime:
          allOf: [{ $ref: "#/components/schemas/ClockTime" }]
          nullable: true

    AvailabilityExceptionCreate:
      type: object
      required: [date, type]
      properties:
        date: { type: string, format: date }
        type: { $ref: "#/components/schemas/AvailabilityExceptionType" }
        startTime:
          allOf: [{ $ref: "#/components/schemas/ClockTime" }]
          nullable: true
        endTime:
          allOf: [{ $ref: "#/components/schemas/ClockTime" }]
          nullable: true

    AvailabilityExceptionUpdate:
      type: object
      properties:
        date: { type: string, format: date }
        type: { $ref: "#/components/schemas/AvailabilityExceptionType" }
        startTime:
          allOf: [{ $ref: "#/components/schemas/ClockTime" }]
          nullable: true
        endTime:
          allOf: [{ $ref: "#/components/schemas/ClockTime" }]
          nullable: true

    Patient:
      type: object
      required: [id, name, phone, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone:
          type: string
          description: >
            Stored as E.164. Identity is the (phone, normalized name)
            pair, which is unique — one phone number may have multiple
            registered patients (spec.md §2).
        dob: { type: string, format: date, nullable: true }
        email: { type: string, format: email, nullable: true }
        createdAt: { type: string, format: date-time }

    PatientCreate:
      type: object
      required: [name, phone]
      properties:
        name: { type: string, minLength: 1 }
        phone: { type: string }
        dob: { type: string, format: date, nullable: true }
        email: { type: string, format: email, nullable: true }

    PatientUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        phone: { type: string }
        dob: { type: string, format: date, nullable: true }
        email: { type: string, format: email, nullable: true }

    PatientPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Patient" }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }

    MedicalHistoryKind:
      type: string
      enum: [entry, amendment]

    MedicalHistoryEntry:
      type: object
      required: [id, patientId, kind, description, recordedAt, recordedBy]
      properties:
        id: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/MedicalHistoryKind" }
        amendsEntryId: { type: string, format: uuid, nullable: true }
        description:
          type: string
          description: Free text (spec.md §2) — no structured fields.
        recordedAt: { type: string, format: date-time }
        recordedBy: { type: string, format: uuid }

    MedicalHistoryEntryCreate:
      type: object
      required: [description]
      properties:
        kind:
          allOf: [{ $ref: "#/components/schemas/MedicalHistoryKind" }]
          default: entry
        amendsEntryId:
          type: string
          format: uuid
          nullable: true
          description: Required when kind is `amendment`.
        description: { type: string, minLength: 1 }

    Slot:
      type: object
      required: [doctorId, specialtyId, startTime, endTime, isEmergency]
      properties:
        doctorId: { type: string, format: uuid }
        specialtyId: { type: string, format: uuid }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        isEmergency:
          type: boolean
          description: True if this slot is held-back emergency capacity.

    AppointmentStatus:
      type: string
      enum:
        - booked
        - checked_in
        - in_consultation
        - completed
        - no_show
        - cancelled

    AppointmentSource:
      type: string
      enum: [scheduled, walk_in]

    CancellationType:
      type: string
      enum: [standard, force, rescheduled]

    EmergencyJustification:
      type: string
      enum: [triage, front_desk_judgment]

    Appointment:
      type: object
      required:
        [id, doctorId, patientId, startTime, endTime, status, source, isEmergencySlot, createdAt]
      properties:
        id: { type: string, format: uuid }
        doctorId: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/AppointmentStatus" }
        source: { $ref: "#/components/schemas/AppointmentSource" }
        isEmergencySlot: { type: boolean }
        emergencyJustification:
          allOf: [{ $ref: "#/components/schemas/EmergencyJustification" }]
          nullable: true
        emergencyReason: { type: string, nullable: true }
        emergencyAuthorizedBy: { type: string, format: uuid, nullable: true }
        reportedSymptoms: { type: string, nullable: true }
        triageResultId: { type: string, format: uuid, nullable: true }
        followUpOfAppointmentId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        checkedInAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
        cancelledBy: { type: string, format: uuid, nullable: true }
        cancellationType:
          allOf: [{ $ref: "#/components/schemas/CancellationType" }]
          nullable: true
        cancelReason: { type: string, nullable: true }
        rescheduledToId: { type: string, format: uuid, nullable: true }

    AppointmentCreate:
      type: object
      required: [doctorId, patientId, startTime]
      properties:
        doctorId: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        startTime: { type: string, format: date-time }
        source:
          allOf: [{ $ref: "#/components/schemas/AppointmentSource" }]
          default: scheduled
        reportedSymptoms: { type: string, nullable: true }
        triageResultId:
          type: string
          format: uuid
          nullable: true
          description: Triage result for this patient this booking relies on.
        emergencyJustification:
          allOf: [{ $ref: "#/components/schemas/EmergencyJustification" }]
          nullable: true
          description: >
            Required when the chosen slot is held-back emergency capacity
            (spec.md §4); the server verifies it.
        emergencyReason:
          type: string
          nullable: true
          description: Required when emergencyJustification is front_desk_judgment.

    AppointmentPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Appointment" }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }

    Urgency:
      type: string
      enum: [emergency, urgent, routine]

    TriageSource:
      type: string
      enum: [model, red_flag]

    AITriageResult:
      type: object
      required:
        [id, patientId, reportedSymptoms, urgency, effectiveUrgency, suggestedSpecialtyId, confidenceScore, source, disclaimer, createdAt]
      properties:
        id: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        reportedSymptoms: { type: string }
        urgency:
          allOf: [{ $ref: "#/components/schemas/Urgency" }]
          description: The original AI / red-flag urgency. Never overwritten.
        effectiveUrgency:
          allOf: [{ $ref: "#/components/schemas/Urgency" }]
          description: The override if present, otherwise `urgency`.
        suggestedSpecialtyId: { type: string, format: uuid }
        confidenceScore:
          type: number
          minimum: 0
          maximum: 1
          description: Informational only; never used to gate logic.
        source: { $ref: "#/components/schemas/TriageSource" }
        modelVersion: { type: string, nullable: true }
        promptVersion: { type: string, nullable: true }
        disclaimer:
          type: string
          description: >
            Server-side constant, never model-generated. Must always be
            shown alongside the result (spec.md §5).
        overriddenBy: { type: string, format: uuid, nullable: true }
        overriddenAt: { type: string, format: date-time, nullable: true }
        overriddenUrgency:
          allOf: [{ $ref: "#/components/schemas/Urgency" }]
          nullable: true
        overriddenSpecialtyId: { type: string, format: uuid, nullable: true }
        overrideReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    PreVisitSummary:
      type: object
      required: [appointmentId, summary, disclaimer, stale, generatedAt]
      properties:
        appointmentId: { type: string, format: uuid }
        summary:
          type: string
          description: >
            Assembled from patient history, reported symptoms, and the
            triage result (spec.md §5.2).
        disclaimer: { type: string }
        stale:
          type: boolean
          description: True when inputs changed since generation.
        generatedAt: { type: string, format: date-time }

    VisitNote:
      type: object
      required: [id, appointmentId, doctorNotes, locked, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        appointmentId: { type: string, format: uuid }
        doctorNotes: { type: string }
        aiDraftSummary: { type: string, nullable: true }
        aiDraftDisclaimer: { type: string, nullable: true }
        finalSummary: { type: string, nullable: true }
        finalizedBy: { type: string, format: uuid, nullable: true }
        finalizedAt: { type: string, format: date-time, nullable: true }
        locked:
          type: boolean
          description: True once finalized.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    QueueItem:
      allOf:
        - $ref: "#/components/schemas/Appointment"
        - type: object
          required: [patientName, doctorName]
          properties:
            patientName: { type: string }
            doctorName: { type: string }

    DailyQueue:
      type: object
      required: [date, booked, checkedIn, inProgress, completed, noShows, cancelled]
      properties:
        date: { type: string, format: date }
        booked:
          type: array
          items: { $ref: "#/components/schemas/QueueItem" }
        checkedIn:
          type: array
          items: { $ref: "#/components/schemas/QueueItem" }
        inProgress:
          type: array
          items: { $ref: "#/components/schemas/QueueItem" }
        completed:
          type: array
          items: { $ref: "#/components/schemas/QueueItem" }
        noShows:
          type: array
          items: { $ref: "#/components/schemas/QueueItem" }
        cancelled:
          type: array
          items: { $ref: "#/components/schemas/QueueItem" }

    ClinicSettings:
      type: object
      required:
        [cancellationCutoffHours, emergencySlotsPerDoctorPerDay, followUpMaxDays, clinicTimezone]
      properties:
        cancellationCutoffHours:
          type: number
          minimum: 0
          default: 2
          description: Governs both cancellation and reschedule (spec.md §4).
        emergencySlotsPerDoctorPerDay:
          type: integer
          minimum: 0
          default: 1
        followUpMaxDays:
          type: integer
          minimum: 1
          default: 30
        clinicTimezone:
          type: string
          example: Asia/Kolkata
          description: IANA time zone name; defines "today" and availability wall-times.
        defaultTriageSpecialtyId:
          type: string
          format: uuid
          nullable: true
          description: >
            Specialty attached to a red-flag triage result returned while
            the AI provider is unavailable (spec.md §5.1).

    ClinicSettingsUpdate:
      type: object
      properties:
        cancellationCutoffHours: { type: number, minimum: 0 }
        emergencySlotsPerDoctorPerDay: { type: integer, minimum: 0 }
        followUpMaxDays: { type: integer, minimum: 1 }
        clinicTimezone: { type: string }
        defaultTriageSpecialtyId: { type: string, format: uuid, nullable: true }

    AuditAction:
      type: string
      enum:
        - force_cancel
        - triage_override
        - emergency_authorization
        - user_created
        - user_updated
        - password_reset
        - clinic_settings_changed

    AuditLogEntry:
      type: object
      required: [id, action, actorId, targetType, targetId, createdAt]
      properties:
        id: { type: string, format: uuid }
        action: { $ref: "#/components/schemas/AuditAction" }
        actorId: { type: string, format: uuid }
        targetType: { type: string }
        targetId: { type: string, format: uuid }
        reason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    AuditLogPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditLogEntry" }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
